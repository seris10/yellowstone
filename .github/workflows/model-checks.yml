name: Model checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yellowstone_python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: yellowstone_python/requirements-reference.lock
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-reference.lock
      - run: .venv/bin/python -m pip install -e . --no-deps --no-build-isolation
      - run: .venv/bin/python -m tools.run_evidence --name isolated-tests --junit ../work/isolated-tests.xml -- .venv/bin/python -m pytest -m 'not needs_world' --junitxml=../work/isolated-tests.xml -q
      - run: .venv/bin/python -m tools.run_evidence --name reference-experiment -- .venv/bin/python -m tools.reference_run --out ../work/reference-experiment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-evidence
          path: |
            evidence/receipts/
            work/isolated-tests.xml
            work/reference-experiment.json
  scientific-world:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Verify acquired world input location
        shell: bash
        run: test -n "$YELLOWSTONE_WORLD" && test -f "$YELLOWSTONE_WORLD/data/terrain.f32"
      - name: Scientific tests and build
        working-directory: yellowstone_python
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-reference.lock
          .venv/bin/python -m pip install -e . --no-deps --no-build-isolation
          .venv/bin/python -m tools.run_evidence --name scientific-tests --junit ../work/scientific-tests.xml -- .venv/bin/python -m pytest --junitxml=../work/scientific-tests.xml -q
          .venv/bin/python -m tools.run_evidence --name baseline-build -- .venv/bin/python -m yellowstone_python.build --config configs/baseline.yaml
          .venv/bin/python -m tools.run_evidence --name provenance -- .venv/bin/python -m tools.audit_provenance --dir derived
